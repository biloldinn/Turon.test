services:
  - type: web
    name: taxi-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: BOT_TOKEN
        sync: false # User must set this manually in dashboard
      - key: WEBHOOK_URL
        sync: false # Set to https://your-app.onrender.com
      - key: ADMIN_ID
        sync: false
      - key: DEFAULT_AD_INTERVAL
        value: 5
